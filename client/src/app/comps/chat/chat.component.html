<div class="chat-page">
  <div class="chat-header">
    <a (click)="GoToUser()">
      <div class="profile-pic-wrapper">
        <img class="profile-pic" [src]="targetUser?.profilePicUrl" />
        <span *ngIf="isTargetUserOnline()" class="online-indicator"></span>
      </div>
      <span class="username">{{ targetUser?.firstName }} {{ targetUser?.lastName }}</span>
    </a>
  </div>

  <div class="chat-messages" #messagesContainer (scroll)="onUserScroll($event)">
    <div *ngIf="this.messages.length==0" class="day-separator">
      No messages yet 
    </div>
    
    <ng-container *ngFor="let message of messages; let i = index; trackBy: trackByMessageId">
      <div *ngIf="isNewDay(i)" class="day-separator">
        {{ formatDay(message.sentAt) }}
      </div>

      <div
        [ngClass]="{
          'sent': message.senderId === currentUserId,
          'received': message.senderId !== currentUserId
        }"
        class="message-bubble">

        <div class="message-content">
          <div *ngIf="message.content">{{ message.content }}</div>

          <img
            *ngIf="message.imageUrl && message.fileType === 'image'"
            [src]="message.imageUrl"
            class="sent-image"
            alt="Picture in message"/>

          <div *ngIf="message.imageUrl && message.fileType === 'pdf'" class="pdf-message">
            <div class="pdf-icon-wrapper">
              <lucide-icon name="file-text" [size]="48"></lucide-icon>
            </div>
            <div class="pdf-info">
              <span class="pdf-name">{{ message.fileName || 'Document.pdf' }}</span>
              <button 
                *ngIf="message.imageUrl && message.fileType === 'pdf'" 
                (click)="downloadFile(message.imageUrl, message.fileName || 'Document.pdf')"
                class="download-btn">
                <lucide-icon name="download" [size]="16"></lucide-icon>
                <span>Download</span>
              </button>
            </div>
          </div>

          <button 
            *ngIf="message.imageUrl && message.fileType === 'image'"
            (click)="downloadFile(message.imageUrl, message.fileName || 'image.jpg')"
            class="download-link">
            <lucide-icon name="download" [size]="15"></lucide-icon>
          </button>
        </div>

        <div class="message-footer">
          <div class="timestamp">
            {{ message.sentAt | date: 'shortTime' }}
          </div>

          <div *ngIf="message.senderId === currentUserId" class="status-checks">

            <!-- One gray V — sent but not delivered -->  
            <ng-container *ngIf="shouldShowOneTick(message)">
              <svg
                class="check-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="12"
                viewBox="0 0 22 12"
                fill="none"
                stroke="#7a7a7a"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="1 7 4 11 13 1" />
              </svg>
            </ng-container>

            <!-- Two gray Vs — Delivered but not read -->
            <ng-container *ngIf="shouldShowTwoTicksGray(message)">
              <svg
                class="check-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="12"
                viewBox="0 0 22 12"
                fill="none"
                stroke="#7a7a7a"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="1 7 4 11 13 1" />
                <polyline points="7 7 10 11 19 1" />
              </svg>
            </ng-container>

            <!-- Two blue Vs — Read -->
            <ng-container *ngIf="shouldShowTwoTicksBlue(message)">
              <svg
                class="check-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="12"
                viewBox="0 0 22 12"
                fill="none"
                stroke="#34B7F1"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="1 7 4 11 13 1" />
                <polyline points="7 7 10 11 19 1" />
              </svg>
            </ng-container>

          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <div class="chat-input">
    <div class="attached-file" *ngIf="selectedFile">
      <img *ngIf="selectedFileType === 'image'" [src]="selectedFilePreview" alt="Preview"/>
      <div *ngIf="selectedFileType === 'pdf'" class="pdf-preview">
        <lucide-icon name="file-text" [size]="48"></lucide-icon>
        <span>{{ selectedFile.name }}</span>
      </div>
      <button class="remove-btn" (click)="removeSelectedFile()">×</button>
    </div>
    
    <div class="input-wrapper">
      <div class="emoji-button-wrapper" style="position: relative;">
        <button class="icon-btn" (click)="toggleEmojiPicker()" aria-label="emoji">
          <lucide-icon name="smile"></lucide-icon>
        </button>
        <div *ngIf="showEmojiPicker" class="emoji-picker-popover" #emojiPickerRef>
          <emoji-mart
            (emojiSelect)="addEmoji($event)"
            [style]="{ width: '300px', height: '350px' }"
            [showPreview]="false">
          </emoji-mart>
        </div>
      </div>

      <button class="icon-btn" (click)="fileInput.click()">
        <lucide-icon name="paperclip"></lucide-icon>
      </button>
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*,.pdf" hidden />

      <input
        #messageInputRef
        type="text"
        class="message-input"
        placeholder="Type a message..."
        [(ngModel)]="newMessage"
        (keydown)="handleKeyDown($event)"/>

      <button class="icon-btn" (click)="sendMessage()" [disabled]="!newMessage.trim() && !selectedFile">
        <lucide-icon name="send"></lucide-icon>
      </button>
    </div>
  </div>

</div>
